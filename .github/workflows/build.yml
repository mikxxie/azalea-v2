name: Build Azalea and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build codebase and release
    runs-on: ubuntu-latest #bby no ones going to wait hours for a macos runner to be available
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          version=$(cat ./extension/manifest.json | grep -oE '[ ]+"version": "(.*)",' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "value=$version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        id: dependencies
        run: |
          npm i -g pnpm
          pnpm i --config.ignore-scripts=false

      - name: Build codebase
        id: build
        run: pnpm build

      - name: Prepare for release
        id: prepare
        run: |
          mv dist Azalea-${{ steps.version.outputs.value }}
          zip -r Azalea.zip Azalea-${{ steps.version.outputs.value }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          tag_name: ${{ steps.version.outputs.value }}
          name: Azalea ${{ steps.version.outputs.value }}
          files: |
            ./*.zip
